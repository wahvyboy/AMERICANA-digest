<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Americana Digest - Breaking News, Politics, Culture & Analysis</title>
    <meta name="description" content="Americana Digest delivers high-velocity breaking news, in-depth political investigative journalism, cultural analysis, and consumer intelligence." />
    <meta name="keywords" content="Americana Digest, breaking news, politics, 2026 midterms, Supreme Court, white house, national news, investigative journalism, US economy, consumer shopping, viral culture" />
    <meta name="author" content="Americana Digest Newsroom" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Americana Digest" />
    <meta property="og:title" content="Americana Digest - Breaking News, Politics, Culture & Analysis" />
    <meta property="og:description" content="Americana Digest delivers high-velocity breaking news, in-depth political investigative journalism, cultural analysis, and consumer intelligence." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AmericanaDigest" />
    <meta name="twitter:creator" content="@AmericanaDigest" />
    <meta name="twitter:title" content="Americana Digest - Breaking News, Politics, Culture & Analysis" />
    <meta name="twitter:description" content="Americana Digest delivers high-velocity breaking news, in-depth political investigative journalism, cultural analysis, and consumer intelligence." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1200&q=80" />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Schema.org Structured Data (NewsMediaOrganization & WebSite) for AEO and GEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "NewsMediaOrganization",
          "@id": "https://americanadigest.blog/#organization",
          "name": "Americana Digest",
          "url": "https://americanadigest.blog",
          "logo": {
            "@type": "ImageObject",
            "url": "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=600&q=80",
            "caption": "Americana Digest"
          },
          "sameAs": [
            "https://twitter.com/AmericanaDigest",
            "https://facebook.com/AmericanaDigest"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "support@americanadigest.blog",
            "contactType": "editorial inquiries",
            "areaServed": "US",
            "availableLanguage": "English"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://americanadigest.blog/#website",
          "url": "https://americanadigest.blog",
          "name": "Americana Digest",
          "publisher": {
            "@id": "https://americanadigest.blog/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://americanadigest.blog/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-white text-gray-900 font-sans antialiased selection:bg-[#0E5B44] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
